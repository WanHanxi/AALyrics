name: Refresh v1.2.1 bundled documentation

on:
  push:
    branches: [docs/remove-device-details]
    paths:
      - .github/workflows/privacy-refresh.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-v1.2.1-documentation
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'WanHanxi/AALyrics' && github.ref == 'refs/heads/docs/remove-device-details'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AALYRICS_VERSION_NAME: '1.2.1'
      AALYRICS_VERSION_CODE: '1004'

    steps:
      - name: Check out approved documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify unchanged release tag and runtime sources
        shell: bash
        run: |
          test "$(git rev-parse refs/tags/v1.2.1)" = e61305c51f7cf1a02bc47d3fccbb8b7b1e516c31
          test "$(git rev-parse 'refs/tags/v1.2.1^{}')" = c552b06e77608795326d0362a65de567dde35d81
          python3 - <<'PY'
          import subprocess
          allowed = {
              'AGENTS.md', 'TASK.md', 'CHANGELOG.md',
              'docs/ANDROID_AUTO_ACTIVATION.md',
              'docs/ANDROID_AUTO_MEDIA_STRATEGY.md',
              'docs/MEDIA_CONNECTION_RECOVERY.md',
              '.github/workflows/privacy-refresh.yml',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only', 'v1.2.1', 'HEAD'
          ], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changes: {sorted(unexpected)}')
          print('Runtime sources unchanged; release tag preserved.')
          PY
          git diff --check v1.2.1 HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore existing release signing identity
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AALYRICS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.AALYRICS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.AALYRICS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.AALYRICS_RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aalyrics-release.keystore"

      - name: Build signed APK with sanitized bundled notes
        env:
          PETITLYRICS_USER_ID: ${{ secrets.PETITLYRICS_USER_ID }}
          PETITLYRICS_APP_NAME: ${{ secrets.PETITLYRICS_APP_NAME }}
          PETITLYRICS_PKG_NAME: ${{ secrets.PETITLYRICS_PKG_NAME }}
          PETITLYRICS_CLIENT_APP_ID: ${{ secrets.PETITLYRICS_CLIENT_APP_ID }}
          AALYRICS_RELEASE_STORE_FILE: ${{ runner.temp }}/aalyrics-release.keystore
          AALYRICS_RELEASE_STORE_PASSWORD: ${{ secrets.AALYRICS_RELEASE_STORE_PASSWORD }}
          AALYRICS_RELEASE_KEY_ALIAS: ${{ secrets.AALYRICS_RELEASE_KEY_ALIAS }}
          AALYRICS_RELEASE_KEY_PASSWORD: ${{ secrets.AALYRICS_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease --stacktrace --max-workers=1 --no-parallel --no-daemon
          -Dorg.gradle.jvmargs="-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify package version signature and bundled Changelog
        run: |
          python3 scripts/verify-release-apk.py app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --version-name "$AALYRICS_VERSION_NAME" --version-code "$AALYRICS_VERSION_CODE"

      - name: Stage refreshed APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AALyrics-v1.2.1.apk
          (cd dist && sha256sum AALyrics-v1.2.1.apk > AALyrics-v1.2.1.apk.sha256)

      - name: Sanitize existing release description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          endpoint = 'repos/WanHanxi/AALyrics/releases/440059130'
          release = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert release['tag_name'] == 'v1.2.1' and not release['draft']
          assert not release.get('immutable', False)
          prefix = '- The owner reported successful repeated connection-trigger testing on '
          replacement = '- Connection-trigger testing completed successfully on a physical device.'
          lines = release['body'].splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if matches:
              assert len(matches) == 1
              index = matches[0]
              before, separator, suffix = lines[index].partition(' Recovery after')
              assert separator
              lines[index] = replacement + separator + suffix
          else:
              assert any(line.startswith(replacement) for line in lines)
          body = ''.join(lines)
          marker = 'Packaging note: the v1.2.1 APK was rebuilt with anonymized bundled release notes.'
          if marker not in body:
              body = body.rstrip() + '\n\n' + marker + ' App behavior, version, and signing identity are unchanged.\n'
          payload = json.dumps({'body': body})
          result = subprocess.run(
              ['gh', 'api', '--method', 'PATCH', endpoint, '--input', '-'],
              input=payload, text=True, check=True, capture_output=True,
          )
          assert json.loads(result.stdout)['body'] == body
          (Path(os.environ['RUNNER_TEMP']) / 'expected-release-body.txt').write_text(body)
          print('Release description updated and verified.')
          PY

      - name: Replace v1.2.1 APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.2.1 dist/AALyrics-v1.2.1.apk dist/AALyrics-v1.2.1.apk.sha256 \
            --clobber --repo WanHanxi/AALyrics

      - name: Verify published downloads and release description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh release download v1.2.1 --repo WanHanxi/AALyrics --dir downloaded \
            --pattern AALyrics-v1.2.1.apk --pattern AALyrics-v1.2.1.apk.sha256
          (cd downloaded && sha256sum --check AALyrics-v1.2.1.apk.sha256)
          cmp dist/AALyrics-v1.2.1.apk downloaded/AALyrics-v1.2.1.apk
          cmp dist/AALyrics-v1.2.1.apk.sha256 downloaded/AALyrics-v1.2.1.apk.sha256
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          release = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/WanHanxi/AALyrics/releases/440059130'
          ]))
          assert release['body'] == (Path(os.environ['RUNNER_TEMP']) / 'expected-release-body.txt').read_text()
          assets = {asset['name']: asset for asset in release['assets']}
          for name in ('AALyrics-v1.2.1.apk', 'AALyrics-v1.2.1.apk.sha256'):
              assert assets[name]['size'] == (Path('dist') / name).stat().st_size
          print('Published downloads and release metadata verified.')
          PY
          cat dist/AALyrics-v1.2.1.apk.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove only the affected CI debug artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          targets = [
              (13742353318, 42773060705, 'aalyrics-debug-apk'),
              (13742109200, 42773060705, 'aalyrics-debug.apk'),
              (13743920086, 42774561114, 'aalyrics-debug-apk'),
              (13743870380, 42774561114, 'aalyrics-debug.apk'),
          ]
          for artifact_id, run_id, name in targets:
              endpoint = f'repos/WanHanxi/AALyrics/actions/artifacts/{artifact_id}'
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if result.returncode:
                  if '(HTTP 404)' in result.stderr:
                      print(f'Artifact {artifact_id} is already absent.')
                      continue
                  raise SystemExit(f'Could not inspect artifact {artifact_id}')
              artifact = json.loads(result.stdout)
              assert artifact['id'] == artifact_id
              assert artifact['name'] == name and artifact['workflow_run']['id'] == run_id
              subprocess.run(['gh', 'api', '--method', 'DELETE', endpoint], check=True)
              print(f'Removed affected artifact {artifact_id}.')
          for run_id in sorted({run_id for _, run_id, _ in targets}):
              endpoint = f'repos/WanHanxi/AALyrics/actions/runs/{run_id}/artifacts'
              remaining = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
              remaining_ids = {artifact['id'] for artifact in remaining['artifacts']}
              assert not remaining_ids.intersection(artifact_id for artifact_id, _, _ in targets)
          print('Affected artifacts are no longer available.')
          PY

      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aalyrics-release.keystore"
